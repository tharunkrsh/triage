# Single source of truth for Anthropic Claude API pricing used by tokenize.
# All prices are USD per million tokens (MTok) at base (non-batch, global) rates.
# Cache write/read prices are derived via cache_multipliers (per-model read overrides below).
version: 1
source: https://platform.claude.com/docs/en/about-claude/pricing
retrieved: 2026-11-25

batch_discount: 0.5            # Batch API cost = base cost * batch_discount
cache_multipliers:
  write_5m: 1.25
  write_1h: 2.0
  read: 0.1                    # default; overridden per model via cache_read_multiplier
inference_geo_multipliers:
  global: 1.0
  us: 1.1                      # applies only to models with geo_supported: true (Claude 4.6+)
# Applied to every token category. Priority Tier usage is covered by the capacity commitment,
# so its marginal token cost is $0 (tokens are still reported separately).
service_tier_multipliers:
  standard: 1.0
  priority: 0.0
# Fast mode (`speed: fast`) multiplies a model's input/output rates by its fast_multiplier and
# is never Batch-discounted. Models without fast_multiplier don't offer fast mode.

# Bleed-detector thresholds for `tokenize audit`.
audit:
  uncached_min_input_tokens: 1024   # minimum cacheable prompt length
  uncached_min_repeats: 2           # identical system prompts before caching is suggested
  cache_5m_ttl_seconds: 300         # 5-minute cache TTL (refreshed on each hit)
  bloated_max_tokens_ratio: 4       # flag max_tokens > ratio * output_tokens
  top_n: 10                         # rows in the Top-N offenders table

