# Stable, round-number pricing used by unit tests (not real prices).
version: 1
batch_discount: 0.5
cache_multipliers: {write_5m: 1.25, write_1h: 2.0, read: 0.1}
inference_geo_multipliers: {global: 1.0, us: 1.1}
models:
  test-cliff:
    aliases: [cliff]
    input: 1.00
    output: 5.00
    geo_supported: true
    tiers:
      - {above_prompt_tokens: 100000, input: 5.00, output: 25.00}
  test-flat:
    aliases: [flat]
    input: 2.00
    output: 10.00
    cache_read_multiplier: 0.05
  test-legacy-20240101:
    aliases: [legacy]
    input: 4.00
    output: 20.00
    retired: true
    price_source: historical
