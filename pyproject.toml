[project]
name = "triage"
version = "0.1.0"
description = "Local-first CLI for auditing Anthropic Claude API spend and simulating model downgrades."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "duckdb>=2.0.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
triage = "triage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

# Installed wheels have no repo root, so the pricing table ships inside the package.
[tool.hatch.build.targets.wheel.force-include]
"pricing.yaml" = "triage/pricing.yaml"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
